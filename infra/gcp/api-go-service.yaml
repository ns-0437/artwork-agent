# Cloud Run service for the public GraphQL API + upload endpoint
# (services/api-go/cmd/server). Deploy with:
#   gcloud run services replace infra/gcp/api-go-service.yaml --region=REGION
# after substituting PROJECT_ID/REGION and creating the secrets referenced
# below (see infra/gcp/README.md).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: artwork-agent-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Caps concurrent Cloud Run INSTANCES (parallelism), not total
        # request volume or spend over time - default Cloud Run autoscaling
        # has no instance ceiling. Read-only mode (READ_ONLY_DEMO below) is
        # what actually stops sustained cost from repeated writes; this
        # only bounds how many requests can be served in parallel.
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
        - image: asia-south1-docker.pkg.dev/artwork-agent-demo/artwork-agent/api-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: artwork-agent-database-url
                  key: latest
            - name: STORAGE_BACKEND
              value: gcs
            - name: GCS_BUCKET
              value: artwork-agent-demo-artifacts
            - name: UPLOAD_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: artwork-agent-upload-signing-secret
                  key: latest
            - name: API_BASE_URL
              value: https://artwork-agent-api-619767309039.asia-south1.run.app
            - name: IMAGE_SERVICE_URL
              value: https://artwork-agent-image-python-619767309039.asia-south1.run.app # private ingress, see image-python-service.yaml
            - name: READ_ONLY_DEMO
              # No auth on this public deployment (CLAUDE.md's known gap) -
              # an order-count cap alone still let anyone repeatedly
              # mutate/re-process any EXISTING order, unbounded. This
              # rejects every mutation server-side (graph.Resolver.guarded)
              # rather than relying on the frontend not offering write
              # buttons. Set to "false" only temporarily, to record the
              # live demo's write flow - true the rest of the time.
              value: "true"
            - name: MAX_DEMO_ORDERS
              # Secondary defense-in-depth for if READ_ONLY_DEMO is ever
              # toggled off - caps total order CREATION only, does not by
              # itself restrict writes to existing orders. Local dev leaves
              # this unset (unlimited).
              value: "150"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
