# Deploys services/api-go/cmd/worker AS-IS: a long-running poll loop
# (worker.Worker.Run), not a task that runs to completion. That's why this
# is a Cloud Run SERVICE (min-instances=1, no public ingress, no HTTP
# traffic actually served) rather than a Cloud Run JOB - Cloud Run Jobs are
# for finite work that exits, and this worker's poll loop never does.
#
# The brief's suggested architecture ("Cloud Run Job for queued work") is
# the more idiomatic target: a job invoked on a schedule (Cloud Scheduler +
# Eventarc, or triggered per-enqueue) that claims and drains whatever is
# QUEUED, then exits. Adapting worker.Worker.Run to that shape (process one
# batch and return, instead of an infinite ticker loop) is real code change
# beyond what this deployment-config pass covers - deliberately NOT done
# here per the reduced Day 5 deployment scope (config only, not executed;
# see README.md's Day 5 status). This file deploys the CURRENT code
# correctly; migrating to a true Cloud Run Job is follow-up work.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: artwork-agent-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        # Postgres is a free-tier hosted instance (Neon), reached over the
        # public internet via DATABASE_URL below - no Cloud SQL, so no
        # cloudsql-instances annotation/proxy sidecar here.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1" # exactly one worker - see CLAUDE.md on lease-based single-claim, not on running N of these
    spec:
      containers:
        - image: asia-south1-docker.pkg.dev/artwork-agent-demo/artwork-agent/api-go:latest
          # The image's default CMD is /app/server (see services/api-go/Dockerfile) -
          # this override is what actually runs cmd/worker instead.
          command: ["/app/worker"]
          ports:
            - containerPort: 8082 # matches cmd/worker's healthz listener; Cloud Run needs a probed port
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: artwork-agent-database-url
                  key: latest
            - name: STORAGE_BACKEND
              value: gcs
            - name: GCS_BUCKET
              value: artwork-agent-demo-artifacts
            - name: IMAGE_SERVICE_URL
              value: https://artwork-agent-image-python-619767309039.asia-south1.run.app
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: artwork-agent-groq-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
