services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artwork_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  image-python:
    build:
      context: ../services/image-python
    ports:
      - "127.0.0.1:8081:8081"

  api-go:
    build:
      context: ../services/api-go
    command: ["/app/server"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/artwork_agent?sslmode=disable
      IMAGE_SERVICE_URL: http://image-python:8081
      STORAGE_LOCAL_DIR: /data/artifacts
      API_BASE_URL: http://localhost:8080
      UPLOAD_SIGNING_SECRET: dev-only-insecure-secret
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      image-python:
        condition: service_started

  worker:
    build:
      context: ../services/api-go
    command: ["/app/worker"]
    # Loads GROQ_API_KEY (and ANTHROPIC_API_KEY, GROQ_MODEL if set) from the
    # repo-root .env - it's gitignored and never baked into the image. Only
    # the worker needs this; the agent loop runs there, not in api-go.
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/artwork_agent?sslmode=disable
      IMAGE_SERVICE_URL: http://image-python:8081
      STORAGE_LOCAL_DIR: /data/artifacts
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      image-python:
        condition: service_started

  web:
    build:
      context: ../web
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/graphql
    depends_on:
      - api-go

volumes:
  pgdata:
  artifacts:
